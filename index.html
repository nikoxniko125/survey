<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飲食喜好調查 - Staff Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Apple Dark Theme (預設) */
        :root {
            --main-bg: #000000;
            --card-bg: rgba(28, 28, 30, 0.88);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f5f5f7;
            --text-muted: #86868b;
            --accent-color: #0a84ff;
            --progress-bg: #2c2c2e;
            --input-border: #3a3a3c;
            --btn-bg: #ffffff;
            --btn-text: #000000;
        }

        /* Light Theme (淺色模式) */
        .light-theme {
            --main-bg: #f5f5f7;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.08);
            --text-primary: #1d1d1f;
            --text-muted: #6e6e73;
            --accent-color: #0071e3;
            --progress-bg: #e5e5ea;
            --input-border: #d1d1d6;
            --btn-bg: #1d1d1f;
            --btn-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--main-bg);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Noto Sans HK', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Progress Bar */
        .progress-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 999;
        }

        .progress-bar {
            height: 4px;
            background: var(--progress-bg);
            transition: background-color 0.3s;
        }

        .progress-fill {
            height: 100%;
            width: 16.66%; /* 預設第一頁為 1/6 */
            background: var(--accent-color);
            transition: width 0.3s ease, background-color 0.3s;
        }

        /* 中央卡紙佈局 */
        .survey-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            width: 100%;
            max-width: 680px;
            min-height: 480px;
            padding: 50px 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            display: none;
            flex-direction: column;
            justify-content: space-between;
        }

        .survey-card.active {
            display: flex;
        }

        @media (max-width: 768px) {
            .survey-card { padding: 40px 30px; min-height: 420px; }
        }
        @media (max-width: 480px) {
            .survey-card { padding: 30px 20px; min-height: 380px; border-radius: 16px; }
        }

        .card-header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 35px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .card-header h1 { font-size: 24px; margin-bottom: 25px; }
        }

        .card-body {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
            margin-bottom: 30px;
        }

        .input-group {
            width: 100%;
            max-width: 450px;
        }

        .input-group label, .section-subtitle {
            display: block;
            font-size: 17px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 10px;
            letter-spacing: -0.2px;
        }

        .input-field {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 17px;
            color: var(--text-primary);
            outline: none;
        }

        .input-field:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.15);
        }

        .choice-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .clickable-option {
            width: 100%;
            max-width: 500px;
            background-color: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .clickable-option:hover {
            background-color: rgba(255, 255, 255, 0.04);
        }

        .clickable-option input {
            width: 20px;
            height: 20px;
            margin-right: 16px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        /* 排序小圓圈樣式 */
        .rank-badge {
            width: 26px;
            height: 26px;
            border: 1px solid var(--text-muted);
            border-radius: 50%;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            color: var(--accent-color);
            transition: all 0.2s ease;
        }

        .btn-container {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-btn {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            border: none;
        }

        .btn-next {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            margin-left: auto;
        }

        .btn-next:hover { opacity: 0.9; transform: translateY(-0.5px); }

        .btn-back {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--input-border);
        }

        .btn-back:hover { color: var(--text-primary); border-color: var(--text-muted); }

        .fixed-top-left { position: fixed; top: 24px; left: 32px; z-index: 10; }
        .fixed-footer-left { position: fixed; bottom: 24px; left: 32px; z-index: 10; }

        .lang-toggle-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .lang-toggle-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.1);
        }

        .fixed-footer-right {
            position: fixed;
            bottom: 24px;
            right: 32px;
            z-index: 10;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: -0.1px;
            pointer-events: none;
            text-align: right;
        }

        @media (max-width: 480px) {
            .fixed-top-left { top: 16px; left: 16px; }
            .fixed-footer-left { bottom: 16px; left: 16px; }
            .fixed-footer-right { bottom: 18px; right: 16px; font-size: 11px; }
            .lang-toggle-btn { padding: 6px 12px; font-size: 12px; }
        }

        .apple-thanks-hero { font-size: 56px; font-weight: 700; letter-spacing: -1.5px; margin-bottom: 24px; color: var(--text-primary); }
        .apple-thanks-sub { font-size: 19px; line-height: 1.5; color: var(--text-muted); max-width: 460px; font-weight: 400; letter-spacing: -0.2px; }
    </style>
</head>
<body>

    <div class="progress-wrapper">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="fixed-top-left">
        <button class="lang-toggle-btn" onclick="toggleTheme()">Light☀️ / Dark🌙</button>
    </div>

    <div class="fixed-footer-left">
        <button class="lang-toggle-btn" id="langBtn" onclick="toggleLanguage()">中 / ENG</button>
    </div>

    <div class="fixed-footer-right">
        Staff Club team cares about YOU❤️
    </div>

    <div class="survey-card active" id="page-1">
        <div class="card-header">
            <h1 data-cn="飲食喜好調查" data-en="Dietary Preferences Survey">飲食喜好調查</h1>
        </div>
        <div class="card-body">
            <div class="input-group">
                <label id="labelName" data-cn="你的名字" data-en="Your Name">你的名字</label>
                <input type="text" id="username" class="input-field" data-cn="例如：Tom" data-en="e.g. Tom" placeholder="例如：Tom">
            </div>
        </div>
        <div class="btn-container">
            <button class="nav-btn btn-next" onclick="goToPage(2)" data-cn="下一頁" data-en="Next">下一頁</button>
        </div>
    </div>

    <div class="survey-card" id="page-2">
        <div class="card-header">
            <h1 data-cn="飲食類型偏好" data-en="Dietary Type Preferences">飲食類型偏好</h1>
        </div>
        <div class="card-body">
            <div style="width: 100%;">
                <span class="section-subtitle" data-cn="請依喜好順序點擊飲食類型 (1和2必須全選排序)" data-en="Please click dietary types in order of preference (Ranking 1 & 2 required)">請依喜好順序點擊飲食類型 (1和2必須全選排序)</span>
                <div class="choice-list" style="margin-top: 15px; gap: 20px;">
                    <div class="clickable-option diet-rank-option" data-diet="meat" onclick="handleDietRanking(this)">
                        <div class="rank-badge diet-badge"></div>
                        <span data-cn="肉食類 🍖" data-en="Meat Lover 🍖">肉食類 🍖</span>
                    </div>
                    <div class="clickable-option diet-rank-option" data-diet="veggie" onclick="handleDietRanking(this)">
                        <div class="rank-badge diet-badge"></div>
                        <span data-cn="素食類 🥗" data-en="Vegetarian 🥗">素食類 🥗</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="btn-container">
            <button class="nav-btn btn-back" onclick="goToPage(1)" data-cn="返回" data-en="Back">返回</button>
            <button class="nav-btn btn-next" onclick="handleDietRouting()" data-cn="下一頁" data-en="Next">下一頁</button>
        </div>
    </div>

    <div class="survey-card" id="page-3">
        <div class="card-header">
            <h1 data-cn="食物喜好" data-en="Food Preferences">食物喜好</h1>
        </div>
        <div class="card-body" style="justify-content: flex-start; overflow-y: auto; max-height: 310px; padding-right: 5px;">
            <div style="width: 100%;">
                <span class="section-subtitle" data-cn="你平日喜歡食哪種肉類？(可多選)" data-en="Which meats do you prefer? (Multiple)">你平日喜歡食哪種肉類？(可多選)</span>
                <div class="choice-list" style="gap: 12px;">
                    <label class="clickable-option" style="padding: 12px 18px; font-size: 17px;">
                        <input type="checkbox" name="foodChoice" value="豬">
                        <span data-cn="豬肉🐷" data-en="Pork🐷">豬肉🐷</span>
                    </label>
                    <label class="clickable-option" style="padding: 12px 18px; font-size: 17px;">
                        <input type="checkbox" name="foodChoice" value="牛">
                        <span data-cn="牛肉🐮" data-en="Beef🐮">牛肉🐮</span>
                    </label>
                    <label class="clickable-option" style="padding: 12px 18px; font-size: 17px;">
                        <input type="checkbox" name="foodChoice" value="雞">
                        <span data-cn="雞肉🐔" data-en="Chicken🐔">雞肉🐔</span>
                    </label>
                </div>
            </div>

            <div style="margin-top:25px; width:100%;">
                <label class="section-subtitle" data-cn="🚫 不吃的食物" data-en="🚫 Excluded Foods">🚫 不吃的食物</label>
                <input type="text" id="foodRestriction" class="input-field" data-cn="例如：香菜、羊肉、海鮮" data-en="e.g. Coriander, Mutton, Seafood" placeholder="例如：香菜、羊肉、海鮮">
            </div>

            <div style="margin-top:20px; width:100%;">
                <label class="section-subtitle" data-cn="⚠️ 食物敏感" data-en="⚠️ Food Allergies">⚠️ 食物敏感</label>
                <input type="text" id="foodAllergy" class="input-field" data-cn="例如：花生、蝦、牛奶" data-en="e.g. Peanuts, Shrimp, Milk" placeholder="例如：花生、蝦、牛奶">
            </div>
        </div>
        <div class="btn-container">
            <button class="nav-btn btn-back" onclick="goToPage(2)" data-cn="返回" data-en="Back">返回</button>
            <button class="nav-btn btn-next" onclick="handleFoodRouting()" data-cn="下一頁" data-en="Next">下一頁</button>
        </div>
    </div>

    <div class="survey-card" id="page-4">
        <div class="card-header">
            <h1 data-cn="飲品喜好" data-en="Drink Preferences">飲品喜好</h1>
        </div>
        <div class="card-body">
            <div style="width: 100%;">
                <span class="section-subtitle" 
                      data-cn="請依喜好順序點擊飲品種類 (3個種類必須全部排序)" 
                      data-en="Please click drinks in order of preference (All 3 categories required)">
                      請依喜好順序點擊飲品種類 (3個種類必須全部排序)
                </span>
                <div class="choice-list" style="margin-top: 15px; gap: 12px;">
                    <div class="clickable-option drink-rank-option" data-drink="珍珠奶茶" onclick="handleDrinkRanking(this)">
                        <div class="rank-badge drink-badge"></div>
                        <span data-cn="珍珠奶茶" data-en="Bubble Milk Tea">珍珠奶茶</span>&nbsp;🧋
                    </div>
                    <div class="clickable-option drink-rank-option" data-drink="水果茶" onclick="handleDrinkRanking(this)">
                        <div class="rank-badge drink-badge"></div>
                        <span data-cn="水果茶" data-en="Fruit Tea">水果茶</span>&nbsp;🍓
                    </div>
                    <div class="clickable-option drink-rank-option" data-drink="純茶" onclick="handleDrinkRanking(this)">
                        <div class="rank-badge drink-badge"></div>
                        <span data-cn="純茶" data-en="Pure Tea">純茶</span>&nbsp;🍵
                    </div>
                </div>
            </div>
        </div>
        <div class="btn-container">
            <button class="nav-btn btn-back" onclick="goToPage(3)" data-cn="返回" data-en="Back">返回</button>
            <button class="nav-btn btn-next" onclick="goToPage(5)" data-cn="下一頁" data-en="Next">下一頁</button>
        </div>
    </div>

    <div class="survey-card" id="page-5">
        <div class="card-header">
            <h1 data-cn="甜度選擇" data-en="Sweetness Preference">甜度選擇</h1>
        </div>
        <div class="card-body">
            <div style="width: 100%;">
                <span class="section-subtitle" data-cn="甜度選擇 (單選)" data-en="Sweetness Level (Single Choice)">甜度選擇 (單選)</span>
                <div class="choice-list" style="margin-top: 15px; gap: 12px;">
                    <label class="clickable-option" style="padding: 14px 20px; font-size: 18px;">
                        <input type="radio" name="sweetness" value="正常糖" checked>
                        <span data-cn="正常糖" data-en="Regular">正常糖</span>
                    </label>
                    <label class="clickable-option" style="padding: 14px 20px; font-size: 18px;">
                        <input type="radio" name="sweetness" value="半糖">
                        <span data-cn="半糖" data-en="Half Sugar">半糖</span>
                    </label>
                    <label class="clickable-option" style="padding: 14px 20px; font-size: 18px;">
                        <input type="radio" name="sweetness" value="三分糖">
                        <span data-cn="三分糖" data-en="30% Sugar">三分糖</span>
                    </label>
                    <label class="clickable-option" style="padding: 14px 20px; font-size: 18px;">
                        <input type="radio" name="sweetness" value="無糖">
                        <span data-cn="無糖" data-en="No Sugar">無糖</span>
                    </label>
                </div>
            </div>
        </div>
        <div class="btn-container">
            <button class="nav-btn btn-back" onclick="goToPage(4)" data-cn="返回" data-en="Back">返回</button>
            <button class="nav-btn btn-next" id="submitBtn" onclick="submitSurvey()" data-cn="提交投票" data-en="Submit">提交投票</button>
        </div>
    </div>

    <div class="survey-card" id="page-6">
        <div class="card-body" style="align-items: center; justify-content: center; text-align: center; margin-bottom: 0;">
            <h1 class="apple-thanks-hero">Thank You.</h1>
            <div class="apple-thanks-sub">
                <p id="thanksText1" data-cn="你的喜好資料已成功儲存。" data-en="Your preferences have been successfully saved.">你的喜好資料已成功儲存。</p>
                <p id="thanksText2" style="margin-top: 16px; font-size: 16px;" data-cn="Staff Club 將根據你的喜好安排未來活動及餐飲。" data-en="Staff Club will arrange future events and catering based on your choices.">Staff Club 將根據你的喜好安排未來活動及餐飲。</p>
            </div>
        </div>
        <div class="btn-container" style="justify-content: center; margin-top: 40px;">
            <button class="nav-btn btn-next" style="margin-left: 0; padding: 14px 60px; font-size: 17px; border-radius: 24px;" onclick="closeWindow()" data-cn="完成" data-en="Finish">完成</button>
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzc1kVlx9uRXQVnmfwrkl65KC2OTE4YeeXl88bEvC4Kq-7xTobXTBfeFmZJRkvV6BgbsQ/exec'; 
        
        let currentLang = 'cn';
        let selectedDietRank = [];   
        let selectedDrinkRank = [];  

        // 主題切換
        function toggleTheme(){
            document.body.classList.toggle('light-theme');
        }

        // 進度條動態增長 (依據全新 6 頁結構計算)
        function updateProgress(page){
            const percent = (page / 6) * 100;
            document.getElementById('progressFill').style.width = percent + '%';
        }

        // 翻頁控制與強制定填驗證
        function goToPage(pageNum) {
            // 【強制定填 1】第一頁：必須輸入名字
            if (pageNum === 2) {
                const usernameInput = document.getElementById('username').value.trim();
                if (usernameInput === '') {
                    alert(currentLang === 'cn' ? '請先輸入你的名字喔！🍙' : 'Please enter your name first! 🍙');
                    return;
                }
            }

            // 【強制定填 4】第四頁去第五頁：必須將 3 個飲品全部排好順序
            if (pageNum === 5) {
                if (selectedDrinkRank.length < 3) {
                    alert(currentLang === 'cn' ? '請將所有飲品種類都排好喜好順序喔！🧋🥥🍵' : 'Please rank all 3 drink categories in order! 🧋🥥🍵');
                    return;
                }
            }
            
            document.querySelectorAll('.survey-card').forEach(card => card.classList.remove('active'));
            document.getElementById(`page-${pageNum}`).classList.add('active');
            updateProgress(pageNum);
        }

        // 第二頁飲食排序多選點擊
        function handleDietRanking(element) {
            const dietValue = element.getAttribute('data-diet');
            const index = selectedDietRank.indexOf(dietValue);

            if (index === -1) {
                selectedDietRank.push(dietValue);
                element.style.borderColor = 'var(--accent-color)';
                element.style.backgroundColor = 'rgba(10, 132, 255, 0.05)';
            } else {
                selectedDietRank.splice(index, 1);
                element.style.borderColor = 'var(--input-border)';
                element.style.backgroundColor = 'rgba(255, 255, 255, 0.01)';
            }

            document.querySelectorAll('.diet-rank-option').forEach(opt => {
                const val = opt.getAttribute('data-diet');
                const rank = selectedDietRank.indexOf(val);
                const badge = opt.querySelector('.diet-badge');
                
                if (rank !== -1) {
                    badge.innerText = rank + 1; 
                    badge.style.borderColor = 'var(--accent-color)';
                    badge.style.backgroundColor = 'var(--accent-color)';
                    badge.style.color = document.body.classList.contains('light-theme') ? '#ffffff' : '#000000';
                } else {
                    badge.innerText = '';
                    badge.style.borderColor = 'var(--text-muted)';
                    badge.style.backgroundColor = 'transparent';
                }
            });
        }

        // 【強制定填 2】第二頁下一頁驗證：必須選滿 2 個
        function handleDietRouting() {
            if (selectedDietRank.length < 2) {
                alert(currentLang === 'cn' ? '請將所有飲食類型都排好優先順序喔！🍖🥗' : 'Please rank all dietary type preferences! 🍖🥗');
                return;
            }
            goToPage(3);
        }

        // 【強制定填 3】第三頁下一頁驗證
        function handleFoodRouting() {
            if (selectedDietRank[0] === 'meat') {
                const checkedMeats = document.querySelectorAll('input[name="foodChoice"]:checked');
                if (checkedMeats.length === 0) {
                    alert(currentLang === 'cn' ? '你將肉食類排在第一偏好，請至少勾選一種你想食的肉類喔！🍖' : 'Please select at least one type of meat! 🍖');
                    return;
                }
            }
            goToPage(4);
        }

        // 第四頁飲品排序多選點擊
        function handleDrinkRanking(element) {
            const drinkName = element.getAttribute('data-drink');
            const index = selectedDrinkRank.indexOf(drinkName);

            if (index === -1) {
                selectedDrinkRank.push(drinkName);
                element.style.borderColor = 'var(--accent-color)';
                element.style.backgroundColor = 'rgba(10, 132, 255, 0.05)';
            } else {
                selectedDrinkRank.splice(index, 1);
                element.style.borderColor = 'var(--input-border)';
                element.style.backgroundColor = 'rgba(255, 255, 255, 0.01)';
            }

            document.querySelectorAll('.drink-rank-option').forEach(opt => {
                const name = opt.getAttribute('data-drink');
                const rank = selectedDrinkRank.indexOf(name);
                const badge = opt.querySelector('.drink-badge');
                
                if (rank !== -1) {
                    badge.innerText = rank + 1; 
                    badge.style.borderColor = 'var(--accent-color)';
                    badge.style.backgroundColor = 'var(--accent-color)';
                    badge.style.color = document.body.classList.contains('light-theme') ? '#ffffff' : '#000000';
                } else {
                    badge.innerText = '';
                    badge.style.borderColor = 'var(--text-muted)';
                    badge.style.backgroundColor = 'transparent';
                }
            });
        }

        // 完美中英切換（全面支援 Input Placeholder 與全新甜度）
        function toggleLanguage() {
            currentLang = (currentLang === 'cn') ? 'en' : 'cn';
            
            document.querySelectorAll('[data-cn]').forEach(el => {
                const text = el.getAttribute(`data-${currentLang}`);
                if (el.tagName === 'INPUT') {
                    el.placeholder = text;
                } else {
                    el.innerText = text;
                }
            });
        }

        // 提交問卷數據至 Google 後台
        function submitSurvey() {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = (currentLang === 'cn') ? '傳送中...' : 'Sending...';

            const username = document.getElementById('username').value || 'Anonymous';
            const dietRankStrings = selectedDietRank.map((diet, idx) => `第${idx + 1}偏好:${diet === 'meat' ? '肉食' : '素食'}`);

            let foodArray = [];
            const checkedBoxes = document.querySelectorAll('input[name="foodChoice"]:checked');
            if (checkedBoxes.length > 0) {
                checkedBoxes.forEach(cb => foodArray.push(cb.value));
            } else {
                foodArray.push('無勾選肉類');
            }

            const restriction = document.getElementById('foodRestriction')?.value || '無';
            const allergy = document.getElementById('foodAllergy')?.value || '無';
            
            // 讀取第五頁單選的甜度
            const sweetness = document.querySelector('input[name="sweetness"]:checked').value;
            const drinkRankStrings = selectedDrinkRank.map((drink, idx) => `第${idx + 1}喜好:${drink}`);

            const payload = {
                name: username,
                choices: [
                    `飲食類型偏好:${dietRankStrings.join(' > ')}`,
                    `食物細項:${foodArray.join('|')}`,
                    `不吃食物:${restriction}`,
                    `食物敏感:${allergy}`,
                    `飲品排序:${drinkRankStrings.join(' > ')}`,
                    `甜度:${sweetness}`
                ],
                remark: `由 Staff Club 問卷網頁提交`
            };

            fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload)
            })
            .then(() => {
                goToPage(6); // 提交成功前往第六頁（致謝頁）
            })
            .catch(err => {
                alert('Submission failed, please try again.');
                console.error(err);
                btn.disabled = false;
                btn.innerText = (currentLang === 'cn') ? '提交投票' : 'Submit';
            });
        }

        function closeWindow() {
            window.close();
            setTimeout(() => {
                alert(currentLang === 'cn' ? '問卷已完成！現在您可以安全地關閉此網頁分頁。' : 'Survey completed! You can now safely close this tab.');
            }, 200);
        }
    </script>
</body>
</html>
